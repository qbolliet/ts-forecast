# Package metadata, build system, dependency groups and tool settings (pytest, coverage)
# for ts-forecast.
[project]
name = "ts-forecast"
version = "0.1.0"
description = "Utilities for forecasting on time series and panel data"
authors = [{ name = "Quentin Bolliet", email = "bolliet.quentin@gmail.com" }]
requires-python = ">=3.13,<4"
readme = "README.md"
license = "MIT"
dependencies = [
    "numpy>=2.3.1,<3",
    "pandas>=3.0,<4",
    "scikit-learn>=1.9,<2",
    "joblib>=1.5.1,<2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1,<7",
    "matplotlib>=3.10.5,<4",
    "seaborn>=0.13.2,<0.14",
    "pytest>=8.4.1,<9",
    "nbclient>=0.11.0",
    "nbformat>=5.10.4",
    "pytest-cov>=7.1.0",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.6.16,<10",
    "mkdocstrings-python>=1.16.12,<2",
]

[tool.uv]
default-groups = [
    "dev",
    "docs",
]

[tool.hatch.build.targets.wheel]
packages = ["tsforecast"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
# Options des doctests lancés explicitement (--doctest-modules absent des addopts)
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
markers = [
    "unit: test unitaire d'un composant isolé de tsforecast",
    "integration: test enchaînant plusieurs composants publics ou des jeux réalistes",
    "slow: test dont l'exécution dépasse 2 secondes",
    "internal: test d'un symbole privé, sans chemin public raisonnable",
]

[tool.coverage.run]
source = ["tsforecast"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
