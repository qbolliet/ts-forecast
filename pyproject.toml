# Package metadata, build system, optional extras (pyarrow, third-party forecasting adapters),
# dependency groups and tool settings (pytest, coverage) for ts-forecast.
[project]
name = "ts-forecast"
version = "0.1.0"
description = "Utilities for forecasting on time series and panel data"
authors = [{ name = "Quentin Bolliet", email = "bolliet.quentin@gmail.com" }]
requires-python = ">=3.13,<4"
readme = "README.md"
license = "MIT"
dependencies = [
    "numpy>=2.3.1,<3",
    "pandas>=3.0,<4",
    "scikit-learn>=1.9,<2",
    "joblib>=1.5.1,<2",
]

[project.optional-dependencies]
# Stockage pyarrow du dtype chaîne de pandas (même sémantique, plus rapide) ; minimum de pandas 3 : 13.0.0
pyarrow = [
    "pyarrow>=13.0.0,<27",
]
# Adapters de paquets de prévision tiers (tsforecast.adapters), un extra par paquet
# sktime : support de pandas 3.1 à partir de 1.3.0 ; sktime borne pandas<3.2, numpy<2.6, scikit-learn<1.10
adapters-sktime = [
    "sktime>=1.3.0,<2",
]
# darts 0.48.1 : modèles de régression en échec (TypeError) sur des séries journalières sous pandas 3.1,
# d'où le plafond de pandas, hérité par adapters-light et adapters-all
adapters-darts = [
    "darts>=0.48.1,<1",
    "pandas>=3.0,<3.1",
]
# utilsforecast (dépendance de hierarchicalforecast) : support de pandas 3 à partir de 0.2.17
adapters-hierarchical = [
    "hierarchicalforecast>=1.5.3,<2",
    "utilsforecast>=0.2.17,<1",
]
# Modèles de fondation Chronos (Chronos-2, Chronos-Bolt) : torch, transformers et accelerate en dépendances
adapters-chronos = [
    "chronos-forecasting>=2.3.2,<3",
]
# Modèles de fondation Timestral (code Apache-2.0 ; poids sous licence « Modified MIT » restreinte selon
# le chiffre d'affaires) : paquet absent de PyPI, dépendance Git figée sur le commit de la version 1.0.0
adapters-timestral = [
    "timestral @ git+https://github.com/mistralai/timestral.git@a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff",
]
# Modèles de fondation t0 (Apache-2.0), exécution torch
adapters-t0 = [
    "tfc-t0[torch]>=0.6.1,<1",
]
# Adapters sans modèle de fondation : aucune dépendance à torch
adapters-light = [
    "ts-forecast[adapters-sktime,adapters-darts,adapters-hierarchical]",
]
adapters-all = [
    "ts-forecast[adapters-light,adapters-chronos,adapters-timestral,adapters-t0]",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1,<7",
    "matplotlib>=3.10.5,<4",
    "seaborn>=0.13.2,<0.14",
    "pytest>=8.4.1,<9",
    "nbclient>=0.11.0",
    "nbformat>=5.10.4",
    "pytest-cov>=7.1.0",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.6.16,<10",
    "mkdocstrings-python>=1.16.12,<2",
    # Mise en forme des signatures séparées (separate_signature) par mkdocstrings
    "ruff>=0.17.6,<1",
]
# Exécution des notebooks d'exemple : tous les adapters et les modèles tiers des démonstrations
notebooks = [
    "ts-forecast[adapters-all]",
    "xgboost>=3.4.1,<4",
    "tslearn>=0.10.0,<0.11",
]

[tool.uv]
default-groups = [
    "dev",
    "docs",
]

[tool.hatch.metadata]
# Références directes (dépendance Git de l'extra adapters-timestral) admises dans les métadonnées ;
# PyPI refuse la publication d'un paquet qui en contient
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["tsforecast"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
# Options des doctests lancés explicitement (--doctest-modules absent des addopts)
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
markers = [
    "unit: test unitaire d'un composant isolé de tsforecast",
    "integration: test enchaînant plusieurs composants publics ou des jeux réalistes",
    "slow: test dont l'exécution dépasse 2 secondes",
    "internal: test d'un symbole privé, sans chemin public raisonnable",
    "network: test qui télécharge des données ou des poids de modèles ; jamais exécuté en CI",
]

[tool.coverage.run]
source = ["tsforecast"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
